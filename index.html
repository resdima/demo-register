<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Electricity for Afghanistan</title>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
/* VOICE clear, short sentences for leaders; every number with its source
   IDEA a working control room: each power line is its own 3D model with a live tool beside it
   PICTURE 3D line models, a 3D "where is each question" board, live cards and one-page reports
   COLOUR light and dark; each page its own accent (navy, blue, green, violet, teal); status green/amber/grey/red
   TYPE Figtree 900/800 + Figtree
   LAYOUT glass top bar (pages, language, theme); hero; sections; phone: one column */
:root{color-scheme:light;--bg:#f5f6f8;--bg2:#eceff3;--card:#fdfdfe;--ink:#1c2533;--ink2:#3a4556;--mute:#687386;--rule:#dfe3e9;--glass:rgba(245,246,248,.86);--sh:0 6px 22px rgba(28,37,51,.07);--th:#1e3a8a;--th2:#e6edff;--ok:#16a34a;--part:#f59e0b;--nd:#94a3b8;--no:#dc2626;--ex:#fffbeb;--exb:#f3d79a;--exi:#7a5a12}
:root[data-theme=dark]{color-scheme:dark;--bg:#151a23;--bg2:#1a202b;--card:#1e2533;--ink:#e3e7ee;--ink2:#c2c9d4;--mute:#8e98a9;--rule:#2c3444;--glass:rgba(21,26,35,.86);--sh:0 6px 22px rgba(0,0,0,.28);--th2:#222b3c;--ex:#2b271c;--exb:#4d432a;--exi:#e8c983}
body[data-p=uz]{--th:#1d6ff2}body[data-p=tj]{--th:#16a34a}body[data-p=tm]{--th:#7c3aed}body[data-p=test]{--th:#0d9488}
:root[data-theme=dark] body[data-p=project]{--th:#7f97e8}:root[data-theme=dark] body[data-p=uz]{--th:#6a9ce8}:root[data-theme=dark] body[data-p=tj]{--th:#4fb87a}:root[data-theme=dark] body[data-p=tm]{--th:#a593e0}:root[data-theme=dark] body[data-p=test]{--th:#4cbcae}
body[data-p=uz]{--th2:#e6efff}body[data-p=tj]{--th2:#e3f8ea}body[data-p=tm]{--th2:#efe9ff}body[data-p=test]{--th2:#dcf7f3}
:root[data-theme=dark] body[data-p]{--th2:#232c3e}
*{box-sizing:border-box;min-width:0}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 Figtree,system-ui,sans-serif;overflow-x:clip;transition:background .3s,color .3s}
a{color:inherit}
nav.top{position:sticky;top:0;z-index:20;background:var(--glass);backdrop-filter:saturate(1.4) blur(12px);border-bottom:1px solid var(--rule)}
nav.top .in{max-width:1400px;margin:0 auto;padding:8px 16px;display:flex;gap:6px 10px;align-items:center;flex-wrap:wrap}
.logo{font-weight:900;font-size:17px;margin-right:auto;display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo i{width:28px;height:28px;border-radius:9px;background:var(--th);display:grid;place-items:center;color:#fff;font-style:normal;font-size:15px}
.pages{display:flex;gap:4px;flex-wrap:wrap}
.pages a{text-decoration:none;color:var(--mute);font-weight:800;font-size:14.5px;padding:8px 12px;border-radius:20px;white-space:nowrap}
.pages a:hover{color:var(--ink);background:var(--th2)}
.pages a[aria-current=page]{background:var(--th);color:#fff}
.tog{display:flex;gap:4px;align-items:center}
.tog button{font:inherit;font-weight:800;font-size:13.5px;min-height:36px;min-width:40px;padding:0 10px;border-radius:18px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer}
.tog button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
section.page{display:none}section.page.on{display:block}
.wrap{max-width:1400px;margin:0 auto;padding:0 max(4vw,16px)}
.hero{position:relative;overflow:hidden;padding:clamp(28px,3.6vw,52px) 0 24px;background:radial-gradient(900px 380px at 85% -10%,color-mix(in srgb,var(--th) 12%,transparent),transparent 70%),var(--bg)}
.kick{display:inline-flex;gap:8px;align-items:center;font-weight:800;font-size:13.5px;color:var(--th);background:var(--th2);border:1px solid color-mix(in srgb,var(--th) 30%,transparent);border-radius:20px;padding:5px 12px;margin-bottom:14px}
h1{font-size:clamp(30px,4.2vw,58px);line-height:1.03;margin:0 0 16px;font-weight:900;letter-spacing:-.025em;text-wrap:balance;max-width:19ch}
h1 em{font-style:normal;color:var(--th)}
.lead{font-size:clamp(18px,1.6vw,21px);max-width:62ch;margin:0 0 12px;color:var(--ink2)}
.by{font-size:15px;color:var(--mute);margin:0}
.cta{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0 6px}
.cta a{text-decoration:none;font-weight:800;padding:12px 20px;border-radius:26px;border:1.5px solid var(--rule);background:var(--card)}
.cta a.pri{background:var(--th);border-color:var(--th);color:#fff}
h2{font-size:clamp(26px,3vw,40px);line-height:1.08;margin:0 0 10px;font-weight:900;letter-spacing:-.02em;text-wrap:balance}
h3{font-size:20px;margin:0 0 6px;font-weight:800;line-height:1.25}
.sec{padding:clamp(26px,3.2vw,46px) 0}
.sec.alt{background:var(--bg2)}
.intro{max-width:80ch;color:var(--ink2);margin:0 0 16px}
.num{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--th);color:#fff;font-weight:900;font-size:17px;margin-right:12px;vertical-align:5px}
.src{font-size:13.5px;color:var(--mute);margin:10px 0 0}
.card{background:var(--card);border:1px solid var(--rule);border-radius:20px;box-shadow:var(--sh)}
.pad{padding:16px 18px}
.reveal{opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
.reveal.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}html{scroll-behavior:auto}}
.hgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(20px,3vw,44px);align-items:center}.hgrid .facts{grid-template-columns:repeat(2,minmax(0,1fr));margin-top:0}.hgrid h1{max-width:none}
.tchips{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.tchips div{display:flex;gap:10px;align-items:center;padding:14px 16px;font-weight:800}.tchips i{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-style:normal;color:#fff;background:var(--nd);flex:none;transition:background .3s}.tchips i.ok{background:var(--ok)}
@media(max-width:980px){.hgrid{grid-template-columns:minmax(0,1fr)}}
.sum3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin:18px 0 0}
.sum3 div{background:var(--card);border:1px solid var(--rule);border-radius:18px;padding:14px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.sum3 div::before{content:"";position:absolute;inset:0 0 auto;height:4px;background:var(--th)}
.sum3 b{display:block;font-size:17px;margin-bottom:3px}.sum3 span{font-size:15.5px;color:var(--ink2)}
.fig{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--rule);background:var(--figbg,linear-gradient(#eef2f6,#e3e8ef))}
:root[data-theme=dark] .fig{--figbg:linear-gradient(#1b2230,#171d29)}
.fig canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.fig .hint{position:absolute;right:10px;bottom:10px;font-size:13px;background:var(--glass);border-radius:12px;padding:3px 10px;color:var(--mute);pointer-events:none}
.fig .ttl{position:absolute;left:12px;top:10px;font-size:14px;font-weight:800;background:var(--glass);border-radius:12px;padding:4px 12px;pointer-events:none}
.fig.drag{cursor:grab;touch-action:pan-y}.jfig{width:100%;aspect-ratio:3/1;margin-top:14px}@media(max-width:600px){.jfig .ttl{display:none}}@media(max-width:900px){.jfig{aspect-ratio:2.4/1}}@media(max-width:520px){.jfig{aspect-ratio:1.7/1}}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}@media(max-width:1150px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:600px){.stats{grid-template-columns:minmax(0,1fr)}}
.stat{padding:18px}
.stat .k{font-size:14px;font-weight:800;color:var(--mute)}
.stat .v{font-size:clamp(44px,5vw,64px);font-weight:900;line-height:1;color:var(--th);margin:8px 0 2px;font-variant-numeric:tabular-nums}
.stat .u{font-weight:800;font-size:16px;margin-bottom:6px}
.stat p{margin:0;font-size:15.5px;color:var(--ink2)}
.ppl{display:flex;gap:4px;margin:12px 0 6px}
.ppl svg{width:22px;height:30px}
.bar{display:flex;height:16px;border-radius:8px;overflow:hidden;margin:12px 0 6px;background:var(--rule)}
.bar i{display:block;height:100%}
.bar+.lg{display:flex;justify-content:space-between;font-size:13px;color:var(--mute);font-weight:700}
.yr{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin:12px 0 6px}
.yr i{height:16px;border-radius:4px;background:var(--rule)}
.yr i.s{background:var(--th)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips span{border:1px solid var(--rule);border-radius:20px;padding:7px 14px;font-weight:700;font-size:15px;background:var(--card)}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}@media(min-width:1500px){.grid2{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}}
.clash h3{font-size:17px}
.vs{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center}
.vs div{background:var(--bg2);border:1px solid var(--rule);border-radius:12px;padding:8px 10px;font-size:15px}
.vs i{font-style:normal;font-weight:900;color:var(--no);font-size:22px}
.clash p{margin:8px 0 0;font-size:15px;color:#d97706;font-weight:700}
.note{background:var(--th2);border-left:5px solid var(--th);border-radius:0 14px 14px 0;padding:12px 16px;margin:14px 0}
.band{background:var(--th);color:#fff;border-radius:24px;padding:clamp(24px,3vw,44px);text-align:center;box-shadow:var(--sh)}
.band small{display:block;font-weight:800;opacity:.85;margin-bottom:10px;font-size:13.5px;letter-spacing:.06em}
.band b{font-size:clamp(22px,2.8vw,36px);line-height:1.2;font-weight:900;text-wrap:balance;display:block}
.flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.step{padding:16px;position:relative}
.step .tag{font-size:13px;font-weight:900;color:var(--th);letter-spacing:.04em}
.step h3{font-size:21px;margin:2px 0 6px}
.step p{margin:0 0 10px;font-size:16px;color:var(--ink2)}
.ex{background:var(--ex);border:1px solid var(--exb);border-radius:12px;padding:8px 10px;font-size:15px}
.ex b{color:var(--exi)}
.pic{height:120px;border-radius:14px;background:var(--bg2);border:1px solid var(--rule);margin-bottom:12px;display:grid;place-items:center;overflow:hidden}
.mcard{width:150px;border:2px solid var(--ink);border-radius:8px;background:var(--card);font-size:11px;font-weight:800}
.mcard div{display:flex;align-items:center;gap:6px;padding:2px 6px;border-top:1px solid var(--rule)}
.mcard div:first-child{border-top:0;background:var(--ink);color:var(--bg)}
.mcard i{width:12px;height:12px;border-radius:6px;display:inline-block}
.mlist{width:170px;background:var(--card);border:1.5px solid var(--ink);border-radius:6px;font-size:10.5px;font-weight:700}
.mlist div{padding:2px 6px;border-top:1px solid var(--rule);display:flex;justify-content:space-between}
.mlist div:first-child{background:var(--ink);color:var(--bg);border:0}
.mclock{display:flex;align-items:flex-end;gap:6px}
.mclock span{width:38px;border-radius:6px 6px 0 0;color:#fff;font-weight:900;font-size:12px;text-align:center;padding-top:4px}
.mpage{width:96px;height:100px;background:#fffbeb;border:1.5px solid #b7791f;border-radius:4px;padding:8px}
.mpage i{display:block;height:5px;background:#e8cf91;border-radius:3px;margin:6px 0}
.cyc{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:20px;align-items:center;margin-top:26px;padding:18px}
.cyc svg{width:100%;height:auto}.cyc p{margin:0 0 6px}
.cyc .rect{fill:var(--card);stroke:var(--th)}.cyc .txt{fill:var(--ink)}.cyc .sub{fill:var(--mute)}.cyc .ring{stroke:color-mix(in srgb,var(--th) 25%,transparent)}.cyc .arr{stroke:var(--th)}.cyc .ah{fill:var(--th)}
.cols4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.col{padding:12px 14px;border-top:6px solid}
.col b{font-size:19px}.col span{display:block;font-size:15px;color:var(--ink2)}
.ladder{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}@media(max-width:700px){.ladder{grid-template-columns:minmax(0,1fr)}}
.ladder div{display:grid;grid-template-columns:60px 1fr;gap:2px 12px;padding:12px 16px}
.ladder b{grid-row:span 2;font-size:26px;font-weight:900;color:var(--th)}
.ladder span{font-size:15px;color:var(--mute)}
.go3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:14px}
.go3 a{display:block;text-decoration:none;padding:18px}
.go3 a:hover{border-color:var(--th)}
.go3 b{display:block;font-size:19px}.go3 span{color:var(--mute);font-size:15px}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-top:20px}
.fact{padding:14px 16px}
.fact b{display:block;font-size:22px;font-weight:900;color:var(--th);line-height:1.15}
.fact span{font-size:15px;color:var(--ink2)}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;align-items:stretch}.split>.fig{aspect-ratio:2.2/1;min-height:0}@media(max-width:700px){.split>.fig{aspect-ratio:1.4/1}}
.card5{overflow:hidden}
.card5 .hd{background:var(--ink);color:var(--bg);padding:11px 16px;font-weight:800;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.card5 .hd span{opacity:.75;font-weight:600;font-size:14px}
.ck{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:10px 14px;border-top:1px solid var(--rule);background:transparent;color:inherit;font:inherit;text-align:left;width:100%;border-left:0;border-right:0;border-bottom:0;cursor:pointer}
.ck:first-of-type{border-top:0}
.ck:hover,.ck.on{background:var(--th2)}
.ck.chg{background:color-mix(in srgb,var(--part) 14%,transparent)}
.l{width:30px;height:30px;border-radius:15px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:14px}
.ck .t{font-weight:800;font-size:15.5px}
.ck .n{grid-column:2/4;font-size:14.5px;color:var(--mute)}
.pill{display:inline-block;font-size:13px;font-weight:800;border-radius:13px;padding:3px 11px;white-space:nowrap;color:#fff}
.btn{font:inherit;font-weight:800;font-size:15.5px;min-height:46px;padding:0 18px;border-radius:23px;border:1.5px solid var(--rule);background:var(--card);color:var(--ink);cursor:pointer;transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--th);border-color:var(--th);color:#fff}
.btn.sel{border-color:var(--th);background:var(--th2)}
.btn:disabled{opacity:.4;cursor:default}
button:focus-visible,a:focus-visible{outline:3px solid var(--th);outline-offset:2px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* mobile + full screen */
.fsb{position:absolute;right:10px;top:10px;z-index:4;width:44px;height:44px;border-radius:22px;border:1px solid var(--rule);background:var(--glass);backdrop-filter:blur(8px);color:var(--ink);font:inherit;font-size:20px;font-weight:900;cursor:pointer;display:grid;place-items:center;box-shadow:var(--sh)}
.fsb:hover{border-color:var(--th)}
.fstip{display:none}
.fig.full{position:fixed!important;inset:0!important;z-index:200!important;width:100vw!important;height:100vh!important;height:100dvh!important;aspect-ratio:auto!important;border-radius:0!important;border:0!important;margin:0!important;top:0!important}
.fig.full .fsb{top:max(12px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right))}
.fig.full .fstip{display:block;position:absolute;left:50%;bottom:max(16px,env(safe-area-inset-bottom));transform:translateX(-50%);font-size:13px;font-weight:800;background:var(--glass);border-radius:14px;padding:6px 14px;color:var(--ink);white-space:nowrap;pointer-events:none}
@media(orientation:landscape){.fig.full .fstip{display:none}}
body.fsopen{overflow:hidden}
@media(max-width:700px){
 nav.top .in{padding:6px 12px;gap:6px}
 .logo{font-size:14.5px;flex:1;min-width:0;margin-right:0}.logo>span{overflow:hidden;text-overflow:ellipsis}.logo i{width:24px;height:24px;font-size:13px;flex:none}.tog{flex:none}
 .tog{order:2}.tog button{min-height:32px;min-width:34px;padding:0 8px;font-size:12.5px}
 .pages{order:3;width:100%;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch;margin:0 -12px;padding:0 12px 2px}
 .pages::-webkit-scrollbar{display:none}
 .pages a{font-size:13.5px;padding:6px 11px;flex:none}
 .split>.fig{aspect-ratio:1/1}

}
@media(max-width:520px){.tool2 .ctl{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;width:100%}.tool2 .ctl .btn{padding:0 4px;font-size:13.5px;min-height:40px;white-space:nowrap}.tool2 .ctl .btn:first-child{grid-column:1/-1}
section .season{display:flex;width:100%}section .season button{flex:1;font-size:14px;padding:0 6px;min-height:42px;white-space:nowrap}
.fig[style*="aspect-ratio:5/4"]{aspect-ratio:1/1!important}}
@media(max-width:520px){.ck{grid-template-columns:32px minmax(0,1fr)}.ck>.pill{grid-column:2;justify-self:start}.ck .n{grid-column:2}}
/* tool */

/* focus mode: one screen */
.card.tool2.tfull{display:flex;flex-direction:column;overflow:hidden}
.tool2.tfull .tbar{flex:none;position:relative}
.tool2.tfull .tgrid{flex:1;min-height:0;width:100%;grid-template-rows:minmax(0,1fr);align-items:stretch;padding-bottom:max(14px,env(safe-area-inset-bottom))}

.qsh{display:none}
@media(max-width:1100px){
 .tool2.tfull .tgrid{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto;gap:10px}
 .tool2.tfull .tgrid .jfig{box-shadow:none}
 .tool2.tfull .qlist{gap:6px;overflow:visible}

}
@media(max-width:700px){
 .tool2.tfull .tbar{grid-template-columns:minmax(0,1fr);padding:10px 12px 0;gap:6px}
 .tool2.tfull .dayw b{font-size:28px}.tool2.tfull .dayw span{font-size:10.5px}

}

@media(max-width:700px){

 tj:{sH:"Summer and winter",sI:"Switch the season. The model, the river and the power flow change.",sum:"☀ Summer (Apr–Sep)",win:"❄ Winter (Oct–Mar)",sumP:"Rivers are full. The hydro plant makes a lot of power. Most exports to Afghanistan happen now.",winP:"Less water. Tajikistan needs the power itself and buys from Uzbekistan. How much is left for Afghanistan? No monthly numbers are published — so A stays grey.",

  oH:"One problem stays on one card",oI:"TAP should go on to Pakistan. In early 2026, Afghanistan–Pakistan relations turned into border fighting. Does that stop work on the other lines? Press the button.",hit:"Add a problem on the Pakistan route",undo:"Reset",chg:"⚑ Written here: problem on the Pakistan route",noChg:"No change. Work goes on.",msg0:"Each line has its own card. A problem is written only on the card of the line it affects.",msg1:"<b>Only the TAP card changed.</b> The Uzbekistan and Tajikistan lines keep working.",oS:"Paper, Section 9 [56, 11]",names:["Uzbekistan line","Tajikistan line","Turkmenistan line (TAP)"],
  whyN:"Why it matters most here: Turkmenistan is not part of the regional systems that share power data (CAPS, REMIT). A simple shared card can work where other systems do not reach."},
 test:{kick:"Does it work?",h1:"Let the computer <em>test the rules</em>",lead:"We wrote the rules of our tool as a small program. Each test gives it a situation and checks the result by itself. Press the button and watch.",run:"▶ Run all 6 tests",of:"of",passed:"checks passed",works:"✓ Works",failed:"✗ Failed",
  T:[["Nobody replies","Can a question get lost?",["Day 7: a reminder was sent","Day 14: the working group has it","Day 30: the ministers have it","No question was lost"]],["A reply comes","Does the card change?",["The question is closed","The card shows the new fact","The line stays “Not ready”","This question did not go to ministers","The change is saved in the history"]],["Two numbers disagree","What if two sources say different things?",["It is marked “unclear”","Both numbers are kept","A question is sent","It cannot be green while unclear","Only the official reply removes the mark"]],["No data is not a “no”","Is a country punished for having no data?",["It stays grey, not red","A question asks for the data","The summary lists it as “data requested”","It does not say “failed”"]],["Everything is confirmed","Does it make extra work?",["No questions are made","Summary: “enough proof to consider”","It also says “not a guarantee”"]],["Problem on one line","Does it stop the other lines?",["It is shown on the Turkmenistan card","Uzbekistan line did not change","Tajikistan line did not change"]]],
  showH:"What the tests show — and what they don’t",yes:"✓ They show",yesL:["No question gets lost.","A reply really changes the card.","Facts that disagree stay visible until an official reply.","Little data is not treated as failure.","A problem on one line does not stop the others."],notY:"! They do not show yet",notL:["That real offices will reply faster.","That electricity will arrive more reliably."],notP:"For that, a real test with real offices is needed (a pilot).",
  realH:"How a real test would work",real:[["Same papers, two people","Two reviewers get the same pack of public documents. They do not talk to each other."],["Old way vs card","Each one checks the line the usual way and with the card."],["Measure","Do they give the same colours? How long does it take? What did they miss?"],["Report everything","Also bad results. Experts in power grids and in contracts check the tool."]],realS:"Paper, Section 10.2",
  howH:"How to start: 6 steps",how:[["Start with one line","The Uzbekistan line. Use the working group made in 2017. No new office, no new money.","Who: the Uzbek–Afghan working group"],["Uzbekistan suggests it","It cares most (78% of its electricity export money). It sends the card to the working group for comments.","Who: Uzbekistan"],["Fill the first card","Read official papers. Give each answer a colour, a date and a source. A second person checks.","Who: the working group, with numbers from power companies"],["Start the list and the clock","Every missing answer becomes a question with a date. The real number of days is agreed in the test.","Who: the working group"],["Send one page up","Twice a year to ministers and special envoys. Once a year to the presidents’ meeting.","Who: the working group writes it"],["Check, then grow — or stop","If it helps, add the Tajikistan and Turkmenistan lines. If not, stop.","Who: the governments decide"]],howS:"Paper, Sections 6.4, 9.1 and policy recommendations"},

 p1:{kick:"Студенческое исследование · BirliNk C5+ · Университет Нархоз",h1:"Надёжная электроэнергия для Афганистана — <em>решение Центральной Азии</em>",lead:"Афганистан покупает бо́льшую часть электроэнергии у Центральной Азии. Мы выяснили, почему эту торговлю трудно планировать, и создали простой инструмент, который это исправляет — только с помощью уже существующих групп.",by:"Диёр · Алим Мохаммад Афзал · Зарина",cta:["Посмотреть решение","Попробовать на линии"],
  sum:[["Проблема","Факты о каждой линии разбросаны, и никто не следит за проблемами до их решения."],["Наше решение","Одна карточка с 5 вопросами для каждой линии. Каждый недостающий ответ становится вопросом с датой. Нет ответа — вопрос идёт выше."],["Почему это может работать","Используются уже существующие группы. Без новой организации, без новых денег на старте, без политического признания."]],
  pH:"Проблема",pI:"Четыре факта объясняют, почему это важно.",
  s:[["Афганистану нужна энергия","8 из 10","людей","не имеют надёжного электричества днём и ночью.","ПРООН, ноябрь 2026 [10]"],["Он зависит от импорта","80%","электроэнергии импортируется","Более 90% этого импорта идёт из Центральной Азии.","ПРООН, июнь 2026 [25]"],["Продавцам это тоже нужно","78%","экспортной выручки Узбекистана за электроэнергию","в 2024 году пришлось на Афганистан.","[30]"],["Зима — слабое место","90%+","экспорта электроэнергии Таджикистана","приходится на апрель–сентябрь. Поставки зимой неясны.","[8]"]],
  barL:["Импорт","Своё производство"],yrL:["Янв","Дек"],
  mH:"Встречи уже существуют",mI:"У стран уже много соглашений и встреч. Значит, проблема <b>не</b> в нехватке встреч — и новая организация <b>не</b> нужна.",
  chips:["Соглашение Узбекистана и Афганистана 2017 г. + рабочая группа","Встреча президентов Центральной Азии","Спецпредставители по Афганистану (с 2025 г.)","ЦАРЭС / Азиатский банк развития","Проект CASA-1000","Министры энергетики и водных ресурсов"],
  rH:"Настоящая проблема: факты разбросаны и не совпадают",rI:"Важные факты находятся в разных новостях, на сайтах и в банковских документах. Некоторые противоречат друг другу. Никто не хранит их в одном месте. Четыре реальных примера:",
  cl:[["Срок завершения новой линии Сурхан","Авг 2025: «готово в первом квартале 2027»","Июн 2026: «готово в августе 2027»","Никто не отслеживает изменение в одном месте"],["Грант АБР ($110 млн)","91% средств — в подписанных контрактах","Выплачено $0 (авг 2026)","Связь с новыми узбекскими деньгами неясна"],["Экспорт Таджикистана в Афганистан, 2025","Министерство: 1 760,3 ГВт·ч","Энергокомпания: 1 755,2 ГВт·ч","Нет пояснения разницы"],["Крупный блэкаут, 14 августа 2026","Казахстан: одно объяснение","Кыргызстан: другое объяснение","Причина до сих пор оспаривается"]],
  rN:"Итог: простые вопросы — <b>Когда заработает новая линия? Сколько энергии будет зимой? Безопасна ли оплата? Кто должен решить каждую проблему?</b> — не имеют одного ясного ответа.",rS:"Работа, раздел 4.2 [43, 44, 45, 8, 9, 28, 29]",
  gH:"Ещё одна трудность: признание",gP:"Почти ни одна страна официально не признала нынешнее правительство Афганистана (Россия стала первой и к августу 2026 года — единственной). Но чиновники Центральной Азии продолжают работать с афганскими техническими партнёрами, например с энергокомпанией <b>DABS</b>. Поэтому новый договор сложен — а <b>небольшой технический инструмент</b> возможен.",gS:"[52–54]",
  rqL:"НАШ ИССЛЕДОВАТЕЛЬСКИЙ ВОПРОС",rq:"Как странам Центральной Азии сделать торговлю электроэнергией с Афганистаном надёжнее — без новой организации и не дожидаясь признания?",
  solH:"Наше решение: один простой инструмент из 4 частей",solI:"Инструментом пользуются <b>уже существующие</b> группы. Ничего нового не строится. Он следит, чтобы важные факты были в одном месте и ни одна проблема не была забыта.",
  parts:[["ЧАСТЬ 1","Карточка","У каждой линии одна карточка с <b>5 вопросами</b>. Каждый ответ получает цвет — только на основе документов.","Линия Узбекистана, вопрос B «Готова ли линия?» → <b style=\"color:#dc2626\">красный</b>: её ещё строят."],["ЧАСТЬ 2","Список","Каждый ответ, который <b>не зелёный</b>, становится вопросом в <b>ведомство, которое знает</b>. У каждого вопроса есть дата.","«Когда будет готова линия?» → отправлен в Минэнерго Узбекистана в день 0."],["ЧАСТЬ 3","Часы","Нет ответа? Вопрос <b>идёт выше</b>: через 7 рабочих дней — напоминание, через 14 — рабочая группа, через 30 — министры.","Нет ответа 30 дней → вопрос на столе министров энергетики."],["ЧАСТЬ 4","Одна страница","Руководители получают <b>одну короткую страницу</b>: что подтверждено, чего не хватает, что застряло.","«Линия строится, завершение подтверждено на авг 2027. У министров: зимние поставки.»"]],
  exL:"Пример:",
  cyc:["1 · Не зелёный","2 · Вопрос","3 · Ответ","4 · Карточка меняется","ОДНО ПРАВИЛО","Нет ответа? Вопрос","идёт выше, пока не ответят."],
  cycH:"Одно правило, которое всё связывает",cycP:["Ответ в карточке не зелёный.","Он становится вопросом в ведомство, которое знает.","Ведомство отвечает. Если нет — вопрос идёт выше: напоминание → рабочая группа → министры.","Карточку проверяют снова с новым фактом. Круг начинается заново."],cycS:"7, 14 и 30 дней — примерные числа. Реальные согласуются позже. Работа, разделы 6 и 6.2.",
  colH:"4 цвета",whyH:"Почему именно эти 5 вопросов?",whyP:"Они повторяют путь электроэнергии: <b>энергия → линия → договор → оплата → контроль</b>. Продать электроэнергию через границу можно, только если все пять работают одновременно. Если одно не работает — торговля останавливается.",
  whoH:"Кто что делает?",whoI:"Четыре уровня. Все они уже существуют. Вопрос начинается внизу и идёт вверх, только если нет ответа.",
  lv:[["L1","Президенты","Встреча президентов Центральной Азии — одна страница в год."],["L2","Министры и спецпредставители","Рассматривают вопросы без ответа. Проверяют зимние и летние поставки."],["L3","Рабочая группа","Например, узбекско-афганская группа 2017 года — ведёт карточку и список, пишет одну страницу."],["L4","Энергокомпании","DABS и энергокомпании Центральной Азии — дают цифры."]],whoS:"Работа, раздел 6.3",
  goH:"Попробуйте инструмент на каждой линии",go:[["Линия Узбекистана →","Линия строится. Проследите все вопросы до ответа."],["Линия Таджикистана →","Лето и зима. Две цифры для одного факта."],["Линия Туркменистана →","Очень мало данных. Одна проблема — на одной карточке."]]},

let LANG="en",L=T.en;

L=T[LANG];

/* ======================= ENGINE ======================= */
const COL={ok:"#16a34a",part:"#f59e0b",nd:"#94a3b8",no:"#dc2626"};
const STC={sent:"#64748b",rem:"#3b82f6",wg:"#f59e0b",min:"#dc2626",done:"#16a34a"};
const BASE={surx:["nd","no","part","part","nd"],tj:["nd","part","part","nd","nd"],tap:["nd","no","part","nd","nd"]};
const stageOf=a=>a>=30?"min":a>=14?"wg":a>=7?"rem":"sent";
function mkCards(){const c={};for(const k in BASE)c[k]=BASE[k].map((st,i)=>({st,n:{key:"base",i}}));return c}
function newSim(k){return{k,day:0,started:false,qs:[],cards:mkCards()[k],init:mkCards()[k],playing:false}}
function simSend(s){if(s.started)return 0;s.started=true;const gv=s.ghostV||{};let n=0;for(let i=0;i<4;i++){if(s.cards[i].st==="ok")continue;s.qs.push({i,born:s.day,stage:"sent",closed:false,v:gv[i]?[...gv[i]]:undefined});n++}if(s.cards[4].st!=="ok"){s.cards[4].st="part";s.cards[4].n={key:"list"}}return n}
const AUTO=[33,34,36,37],AUTOR=[st=>"part",st=>st,st=>st=="nd"?"part":st,st=>st=="nd"?"part":st];
function simAdv(s,d){for(let x=0;x<d;x++){s.day++;for(const q of s.qs)if(!q.closed){q.stage=stageOf(s.day-q.born);if(s.day-q.born>=AUTO[q.i]){q.closed=true;q.stage="done";q.at=s.day;q.auto=true;const c=s.cards[q.i];c.st=AUTOR[q.i](c.st);c.n={key:"auto",i:q.i}}}}}
function simReply(s,i,res){const q=s.qs.find(x=>x.i==i&&!x.closed);if(!q)return;q.closed=true;q.stage="done";q.at=s.day;s.cards[i].st=res;s.cards[i].n={key:"rep",res,i}}
function noteText(k,c,i){if(c.n.key=="base")return L.lines[k].notes[i];if(c.n.key=="auto")return L.lp.auto[i];if(c.n.key=="list")return L.lp.notes.list;const sp=L.lines[k].special[i];return sp&&sp[c.n.res]?sp[c.n.res]:L.lp.notes[c.n.res]}
function overall(card){if(card.every(c=>c.st=="ok"))return L.lp.ov.ok;if(card.some(c=>c.st=="nd"))return L.lp.ov.nd;return L.lp.ov.x}
/* test engine (independent of UI) */
function tState(){const s={day:0,tickets:[],cards:{},flags:{},audit:[],nid:1,open:{}};for(const k in BASE){s.cards[k]=BASE[k].map(st=>({st,note:""}));s.open[k]=false}return s}
function tOpen(s,k){let n=0;const c=s.cards[k];for(let i=0;i<4;i++){if(c[i].st==="ok"&&!s.flags[k+i])continue;if(s.tickets.some(t=>t.k==k&&t.i==i&&!t.closed))continue;s.tickets.push({id:s.nid++,k,i,born:s.day,stage:"sent",closed:false});n++}if(!s.open[k]){s.open[k]=true;if(c[4].st!=="ok")c[4].st="part"}return n}
function tAdv(s,d){for(let x=0;x<d;x++){s.day++;for(const t of s.tickets)if(!t.closed)t.stage=stageOf(s.day-t.born)}}
function tAns(s,id,res,note){const t=s.tickets.find(x=>x.id==id);if(!t||t.closed)return;t.closed=true;t.stage="done";const c=s.cards[t.k][t.i],o=c.st;c.st=res;c.note=note||"reply";if(s.flags[t.k+t.i])delete s.flags[t.k+t.i];s.audit.push({o,res})}
function tConf(s,k,i,a,b){s.flags[k+i]=[a,b];if(s.cards[k][i].st==="ok")s.cards[k][i].st="part";s.audit.push({src:a},{src:b});s.tickets.push({id:s.nid++,k,i,born:s.day,stage:"sent",closed:false,conf:true})}
function tPage(s,k){const c=s.cards[k],by=st=>c.map((x,i)=>x.st==st?i:-1).filter(i=>i>=0);return{all:c.every(x=>x.st=="ok"),req:by("nd"),no:by("no")}}

let ctx,W,H,F,cam,PAL;
const PALS={light:{bld2:"#f1f4f8",road:"#64748b",tTop:"#d3dbe5",tSide:"#a7b5c6",other:"#eef1f5",AF:"#f5d79e",UZ:"#bcd0ea",TJ:"#c9e5c4",TM:"#e3d6ef",stroke:"#8a9bb2",afS:"#b7791f",lbg:"#ffffff",lfg:"#0f172a",lst:"#c7d0dc",bld:"#e2e8f0",str:"#475569",river:"#7cb6ec",slab:"#dbe5f0",afT:"#7a4a06",main:"#1e3a5f",dim:"#7b8797",snow:"#ffffff",hl:"#ffd166"},

const sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2],nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return[a[0]/l,a[1]/l,a[2]/l]};
const cl=(x,a=0,b=1)=>Math.max(a,Math.min(b,x)),lerp=(a,b,k)=>a+(b-a)*k,ease=x=>{x=cl(x);return x*x*(3-2*x)};
function setCam(c){const T_=[c.x,0,c.z];const C=[T_[0]+c.d*Math.sin(c.yaw)*Math.cos(c.pitch),c.d*Math.sin(c.pitch),T_[2]-c.d*Math.cos(c.yaw)*Math.cos(c.pitch)];const f=nrm(sub(T_,C)),r=nrm([f[2],0,-f[0]]),u=[f[1]*r[2]-f[2]*r[1],f[2]*r[0]-f[0]*r[2],f[0]*r[1]-f[1]*r[0]];F=Math.min(H*1.05,W*.78)/(2*Math.tan(.4));cam={C,f,r,u}}
function pr(p){const d=sub(p,cam.C),z=dot(d,cam.f);if(z<.3)return null;return[W/2+F*dot(d,cam.r)/z,H/2-F*dot(d,cam.u)/z,z]}
const LD=nrm([-.45,.85,-.55]);const SC={};
function shade(hex,f){const k=hex+(f*50|0);if(SC[k])return SC[k];const n=parseInt(hex.slice(1),16);return SC[k]=`rgb(${Math.min(255,(n>>16)*f|0)},${Math.min(255,(n>>8&255)*f|0)},${Math.min(255,(n&255)*f|0)})`}

 return t.T.map((T_,i)=>{const r=RES[i];const done=r&&r.done;return`<div class="card test ${done&&r.every(x=>x[1])?"pass":""}"><div class="top"><b>${i+1}. ${T_[0]}</b>${done?(r.every(x=>x[1])?`<span class="pill" style="background:#16a34a">${t.works}</span>`:`<span class="pill" style="background:#dc2626">${t.failed}</span>`):""}</div><p class="why">${T_[1]}</p>${r?`<ul class="res">${r.map(([j,ok])=>`<li class="${ok?"p":"f"}">${esc(T_[2][j])}</li>`).join("")}</ul>`:""}</div>`}).join("")+`<span id="scoreData" data-p="${pass}" data-a="${all}" hidden></span>`}
function pageTest(){const t=L.test;return`<div class="hero"><div class="wrap"><div class="hgrid"><div><span class="kick">⚡ ${t.kick}</span><h1>${t.h1}</h1><p class="lead">${t.lead}</p><div class="row" style="margin-top:16px"><button class="btn pri" data-a="runtests" style="font-size:18px;min-height:56px;padding:0 28px">${t.run}</button><span class="score" id="score"></span></div></div><div class="tchips" id="tchips"></div></div></div></div>
 <div class="sec"><div class="wrap"><div class="tests" id="tests">${testsHTML()}</div></div></div>
 <div class="sec alt"><div class="wrap"><h2>${t.showH}</h2><div class="cmp"><div class="card" style="border-color:var(--ok)"><h3>${t.yes}</h3><ul>${t.yesL.map(x=>`<li>${x}</li>`).join("")}</ul></div><div class="card" style="border-color:#f59e0b"><h3>${t.notY}</h3><ul>${t.notL.map(x=>`<li>${x}</li>`).join("")}</ul><p>${t.notP}</p></div></div></div></div>
 <div class="sec"><div class="wrap"><h2>${t.realH}</h2><div class="tline">${t.real.map(([a,b],i)=>`<div class="card reveal"><b>${i+1}</b><strong>${a}</strong><span>${b}</span></div>`).join("")}</div><p class="src">${t.realS}</p></div></div>
 <div class="sec alt"><div class="wrap"><h2>${t.howH}</h2><div class="tline">${t.how.map(([a,b,c],i)=>`<div class="card reveal"><b>${i+1}</b><strong>${a}</strong><span>${b}</span><em>${c}</em></div>`).join("")}</div><p class="src">${t.howS}</p></div></div>`}

/* ======================= TESTS ======================= */
const TESTS=[
 R=>{const s=tState();tOpen(s,"surx");const sn={};while(s.day<31){tAdv(s,1);if([7,14,30].includes(s.day))sn[s.day]=s.tickets.map(t=>t.stage)}R(0,sn[7].every(x=>x=="rem"));R(1,sn[14].every(x=>x=="wg"));R(2,sn[30].every(x=>x=="min"));R(3,s.tickets.every(t=>!t.closed))},
 R=>{const s=tState();tOpen(s,"surx");tAdv(s,10);const t=s.tickets.find(x=>x.i==1);tAns(s,t.id,"no","confirmed Aug 2027");tAdv(s,21);R(0,t.closed);R(1,s.cards.surx[1].note.includes("confirmed"));R(2,s.cards.surx[1].st=="no");R(3,t.stage=="done");R(4,s.audit.length>0)},
 R=>{const s=tState();tConf(s,"tj",0,"1760.3","1755.2");const q=s.tickets.find(x=>x.conf);R(0,!!s.flags.tj0);R(1,s.audit.length>=2);R(2,!!q);R(3,s.cards.tj[0].st!="ok");tAns(s,q.id,"nd");R(4,!s.flags.tj0)},
 R=>{const s=tState();tOpen(s,"tap");const pg=tPage(s,"tap");R(0,s.cards.tap[0].st=="nd");R(1,s.tickets.some(t=>t.k=="tap"&&t.i==0));R(2,pg.req.includes(0));R(3,!pg.no.includes(0))},
 R=>{const s=tState();for(let i=0;i<5;i++)s.cards.surx[i]={st:"ok",note:""};const n=tOpen(s,"surx");const pg=tPage(s,"surx");R(0,n==0);R(1,pg.all);R(2,pg.all&&T.en.lp.ov.ok.includes("not a guarantee")&&T.ru.lp.ov.ok.includes("не гарантия"))},
 R=>{const s=tState();const b=JSON.stringify([s.cards.surx,s.cards.tj]);s.cards.tap[1]={st:"no",note:"political"};tOpen(s,"tap");R(0,s.cards.tap[1].note=="political");R(1,JSON.stringify(s.cards.surx)==JSON.stringify(JSON.parse(b)[0]));R(2,JSON.stringify(s.cards.tj)==JSON.stringify(JSON.parse(b)[1]))}];
let running=false;
async function runTests(){if(running)return;running=true;RES=[];updTests();for(let i=0;i<TESTS.length;i++){const all=[];TESTS[i]((j,ok)=>all.push([j,!!ok]));const r=RES[i]=[];for(const x of all){r.push(x);updTests();await new Promise(z=>setTimeout(z,130))}r.done=true;updTests()}running=false}
function updTests(){const el=document.getElementById("tests");if(!el)return;el.innerHTML=testsHTML();const tc=document.getElementById("tchips");if(tc)tc.innerHTML=L.test.T.map((x,i)=>{const r=RES[i];const ok=r&&r.done&&r.every(y=>y[1]);return`<div class="card"><i class="${ok?"ok":""}">${ok?"✓":i+1}</i><span>${x[0]}</span></div>`}).join("");const d=document.getElementById("scoreData");const a=+d.dataset.a;document.getElementById("score").textContent=a?`${d.dataset.p} ${L.test.of} ${a} ${L.test.passed}`:""}

/* ======================= VIEWS ======================= */
let views=[],obs=[];
function initViews(){obs.forEach(o=>o.disconnect());obs=[];views=[];
 document.querySelectorAll("canvas[data-v]").forEach(c=>{const v={c,ctx:c.getContext("2d"),key:c.dataset.v,uy:0,up:0,vis:false,W:1,H:1};views.push(v);
  const fit=()=>{const d=Math.min(2,devicePixelRatio||1);v.W=c.clientWidth;v.H=c.clientHeight;c.width=Math.max(1,v.W*d);c.height=Math.max(1,v.H*d);v.ctx.setTransform(d,0,0,d,0,0)};const ro=new ResizeObserver(fit);ro.observe(c);obs.push(ro);fit();
  const io=new IntersectionObserver(e=>{v.vis=e[0].isIntersecting});io.observe(c);obs.push(io);
  if(c.parentElement.classList.contains("drag")){let dr=null;c.addEventListener("pointerdown",e=>{dr=[e.clientX,e.clientY];c.setPointerCapture(e.pointerId)});c.addEventListener("pointermove",e=>{if(!dr)return;v.uy-=(e.clientX-dr[0])*.005;v.up=cl(v.up+(e.clientY-dr[1])*.004,-.45,.6);dr=[e.clientX,e.clientY]});c.addEventListener("pointerup",()=>dr=null);c.addEventListener("pointercancel",()=>dr=null)}})}
const BOUNDS={map:[[-12.1,0,-12.5],[12.1,0,-12.5],[-12.1,0,11],[12.1,0,11],[-3,2,-1]],line:[[-10.4,0,-4],[10.4,0,-4],[-10.4,0,4],[10.4,0,4],[-10.4,3.8,2],[10.4,1.8,2],[0,3,3]],tap:[[-10.4,0,-4],[16.4,0,-4],[-10.4,0,4],[16.4,0,4],[-10.4,3.8,2],[16,1.8,2]],jour:[[-11,-.45,-2.1],[11,-.45,-2.1],[-11,0,3.1],[11,0,3.1],[-8.4,3.9,1.75],[8.4,4.5,1.75],[4.2,4.5,1.75],[-4.2,3.9,1.75]]};
function fitCam(base,pts,v){let c={...base,yaw:base.yaw+v.uy,pitch:cl(base.pitch+v.up,.2,1.4)};for(let it=0;it<8;it++){setCam(c);let x0=1e9,x1=-1e9,y0=1e9,y1=-1e9;for(const p of pts){const q=pr(p);if(!q)continue;x0=Math.min(x0,q[0]);x1=Math.max(x1,q[0]);y0=Math.min(y0,q[1]);y1=Math.max(y1,q[1])}
  const sc=Math.max((x1-x0)/(W*.94),(y1-y0)/(H*.86));const cx=(x0+x1)/2-W/2,cy=(y0+y1)/2-H/2;const dz=dot(sub([c.x,0,c.z],cam.C),cam.f);
  c.x+=cam.r[0]*cx/F*dz-cam.u[0]*cy/F*dz;c.z+=cam.r[2]*cx/F*dz-cam.u[2]*cy/F*dz;c.d*=Math.max(.3,sc)}setCam(c)}
function frame(){const t=performance.now()/1000;PAL=PALS[theme];for(const v of views){if(!(v.vis||window.__all)||!v.c.offsetParent)continue;ctx=v.ctx;W=v.W;H=v.H;SCALE=W<520?.8:W<820?.92:W>1150?1.12:1;ctx.clearRect(0,0,W,H);
  let camD,draw;const key=v.key;
  if(key=="map"){camD=CAM.map;draw=()=>mapScene(t)}else if(key.startsWith("jour:")){const k=key.slice(5);camD=H/W>1.15?{...CAM.jour,yaw:-1.1,pitch:.72,d:15}:H/W>.9?{...CAM.jour,yaw:-.95,pitch:.92,d:15}:H/W>.55?{...CAM.jour,yaw:-.45,pitch:.8,d:15}:CAM.jour;draw=()=>journey(SIM[k],t,k)}else{camD=key=="tap"?CAM.tap:CAM.line;if(H/W>.85)camD={...camD,yaw:camD.yaw-.95,pitch:1.02};draw=()=>lineScene(key,t,HL[key],SIM[key].cards,{season:key=="tj"?season:"summer",pak:key=="tap"})}
  fitCam(camD,BOUNDS[key=="map"?"map":key.startsWith("jour:")?"jour":key=="tap"?"tap":"line"],v);FACES=[];POST=[];LABELS=[];OVER=[];draw();render()}requestAnimationFrame(frame)}

const $=id=>document.getElementById(id);
const ORDER=["project","uz","tj","tm","test"],HASH={project:"project",uzbekistan:"uz",tajikistan:"tj",turkmenistan:"tm",test:"test"},PK={uz:"surx",tj:"tj",tm:"tap"};
let cur="project";
function partial(k){const c=$("card-"+k);if(c)c.innerHTML=cardHTML(k,SIM[k].cards,HL[k],TITLE[k]());const t=$("tool-"+k);if(t){const canv=t.querySelector("canvas");const fig=canv&&canv.parentElement;const of=t.querySelector(".tfull"),st=of?of.scrollTop:0;t.innerHTML=toolHTML(k);const nf2=t.querySelector(".tfull");if(nf2&&st)nf2.scrollTop=st;if(fig){const nf=t.querySelector("canvas").parentElement;nf.replaceWith(fig)}}const b=$("ba-"+k);if(b)b.innerHTML=baHTML(k);const p=$("pg-"+k);if(p)p.innerHTML=onePageHTML(k)}
function renderAll(){L=T[LANG];document.documentElement.lang=LANG;document.documentElement.dataset.theme=theme;$("logoT").textContent=L.logo;$("foot").textContent=L.foot;
 $("pages").innerHTML=L.nav.map((n,i)=>`<a href="#${["project","uzbekistan","tajikistan","turkmenistan","test"][i]}" data-k="${ORDER[i]}">${i+1} · ${n}</a>`).join("");
 $("main").innerHTML=`<section class="page" data-k="project">${pageProject()}</section><section class="page" data-k="uz">${pageLine("surx")}</section><section class="page" data-k="tj">${pageLine("tj")}</section><section class="page" data-k="tm">${pageLine("tap")}</section><section class="page" data-k="test">${pageTest()}</section>`;
 $("lEN").setAttribute("aria-pressed",LANG=="en");$("lRU").setAttribute("aria-pressed",LANG=="ru");$("thB").textContent=theme=="dark"?"☀":"☾";
 show(false);initViews();updTests();reveal()}
function show(scroll=true){document.body.dataset.p=cur;document.querySelectorAll("section.page").forEach(s=>s.classList.toggle("on",s.dataset.k==cur));document.querySelectorAll(".pages a").forEach(a=>a.setAttribute("aria-current",a.dataset.k==cur?"page":"false"));
 const i=ORDER.indexOf(cur);$("nextp").innerHTML=`<a href="#${["uzbekistan","tajikistan","turkmenistan","test","project"][i]}">${L.next[i]}</a>`;if(scroll)window.scrollTo(0,0);reveal()}
function route(){const h=(location.hash||"#project").slice(1);if(h=="solution"){if(cur!="project"){cur="project";show(false)}return}cur=HASH[h]||"project";show()}
let rio;function reveal(){if(rio)rio.disconnect();rio=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");rio.unobserve(e.target)}}),{threshold:.08});document.querySelectorAll(".reveal:not(.in)").forEach(el=>rio.observe(el))}
const timers={};
function act(a){const [cmd,k,i,r]=a.split(":");const s=SIM[k];
 if(cmd=="send"){simSend(s);partial(k)}
 else if(cmd=="d1"){simAdv(s,1);partial(k)}else if(cmd=="d7"){simAdv(s,7);partial(k)}
 else if(cmd=="unfocus"){FOCUS[k]=false;document.body.classList.remove("fsopen");partial(k)}
 else if(cmd=="play"){s.playing=!s.playing;if(s.playing){FOCUS[k]=true;document.body.classList.add("fsopen");timers[k]=setInterval(()=>{if(s.day>=40||!s.qs.some(q=>!q.closed)){s.playing=false;clearInterval(timers[k]);partial(k);return}simAdv(s,1);partial(k)},350)}else clearInterval(timers[k]);partial(k)}
 else if(cmd=="reset"){clearInterval(timers[k]);SIM[k]=newSim(k);partial(k)}
 else if(cmd=="rep"){simReply(s,+i,r);partial(k)}
 else if(cmd=="season"){season=k;const sec=document.querySelector('section[data-k="tj"]');const y=window.scrollY;renderAll();window.scrollTo(0,y)}
 else if(cmd=="tmhit"||cmd=="tmundo"){tmHit=cmd=="tmhit";const y=window.scrollY;renderAll();window.scrollTo(0,y)}
 else if(cmd=="runtests")runTests()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-a]");if(b){act(b.dataset.a);return}const h=e.target.closest("[data-h]");if(h){const [k,i]=h.dataset.h.split(":");HL[k]=HL[k]===+i?null:+i;const c=$("card-"+k);if(c)c.innerHTML=cardHTML(k,SIM[k].cards,HL[k],TITLE[k]())}});
$("lEN").onclick=()=>{LANG="en";try{localStorage.setItem("lang","en")}catch(e){}const y=scrollY;renderAll();scrollTo(0,y)};
$("lRU").onclick=()=>{LANG="ru";try{localStorage.setItem("lang","ru")}catch(e){}const y=scrollY;renderAll();scrollTo(0,y)};
$("thB").onclick=()=>{theme=theme=="dark"?"light":"dark";try{localStorage.setItem("theme",theme)}catch(e){}document.documentElement.dataset.theme=theme;$("thB").textContent=theme=="dark"?"☀":"☾"};
addEventListener("hashchange",route);
cur=HASH[(location.hash||"#project").slice(1)]||"project";renderAll();route();requestAnimationFrame(frame);
const unFocus=()=>{let any=false;for(const k in FOCUS)if(FOCUS[k]){FOCUS[k]=false;any=true;try{partial(k)}catch(e){}}if(any)document.body.classList.remove("fsopen")};addEventListener("keydown",e=>{if(e.key=="Escape")unFocus()});addEventListener("hashchange",unFocus);
window.__s={runTests,SIM,act,setLang:l=>{LANG=l;renderAll()},setTheme:t=>{theme=t;document.documentElement.dataset.theme=t}};
}
try{const nv=document.querySelector("nav.top");const setH=()=>document.documentElement.style.setProperty("--navh",nv.offsetHeight+"px");new ResizeObserver(setH).observe(nv);setH()}catch(e){}
try{const T2={en:{fs:"Full screen",x:"Close",tip:"Turn your phone sideways for a bigger view"},ru:{fs:"Во весь экран",x:"Закрыть",tip:"Поверните телефон, чтобы увеличить"}};
const LG=()=>document.documentElement.lang=="ru"?"ru":"en";
const add=()=>{if(!document.querySelector(".fig.full,.tfull"))document.body.classList.remove("fsopen");addB()};const addB=()=>document.querySelectorAll(".fig").forEach(f=>{if(f.querySelector(":scope>.fsb"))return;const b=document.createElement("button");b.className="fsb";b.type="button";b.textContent="⤢";b.setAttribute("aria-label",T2[LG()].fs);f.appendChild(b);const t=document.createElement("span");t.className="fstip";t.textContent=T2[LG()].tip;f.appendChild(t)});
const close=()=>{document.querySelectorAll(".fig.full").forEach(f=>{f.classList.remove("full");const b=f.querySelector(":scope>.fsb");if(b){b.textContent="⤢";b.setAttribute("aria-label",T2[LG()].fs)}});document.body.classList.remove("fsopen")};
document.addEventListener("click",e=>{const b=e.target.closest(".fsb");if(!b)return;e.preventDefault();e.stopPropagation();const f=b.parentElement;if(f.classList.contains("full")){close();return}close();f.classList.add("full");document.body.classList.add("fsopen");b.textContent="✕";b.setAttribute("aria-label",T2[LG()].x);f.querySelector(".fstip").textContent=T2[LG()].tip},true);
document.addEventListener("keydown",e=>{if(e.key=="Escape")close()});
new MutationObserver(add).observe(document.body,{childList:true,subtree:true});add();window.__fsClose=close}catch(e){}
try{const ctr=()=>{const a=document.querySelector(".pages a[aria-current=page]"),P=a&&a.parentElement;if(P&&P.scrollWidth>P.clientWidth)P.scrollTo({left:a.offsetLeft-P.clientWidth/2+a.offsetWidth/2})};addEventListener("hashchange",()=>setTimeout(ctr,50));setTimeout(ctr,300)}catch(e){}
